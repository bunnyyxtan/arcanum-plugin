name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, deterministic build, MCP conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm unit
      - name: Starter checks (typecheck, two builds compared byte for byte, conformance)
        run: pnpm --silent test
      - name: Bundle size
        run: |
          size=$(stat -c %s dist/plugin.mjs)
          echo "dist/plugin.mjs is $size bytes"
          test "$size" -le 10485760
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-mjs
          path: dist/plugin.mjs
          if-no-files-found: error

  fork-e2e:
    name: End to end on a Base mainnet fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Start anvil fork of Base
        run: |
          anvil --fork-url https://mainnet.base.org --port 8546 --silent &
          for i in $(seq 1 30); do cast block-number --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break; sleep 1; done
      - run: pnpm e2e:fork
        env:
          FORK_RPC: http://127.0.0.1:8546
